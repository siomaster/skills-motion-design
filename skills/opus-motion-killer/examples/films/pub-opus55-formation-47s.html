<script>
/* ===== constantes ===== */
const DUR = 47.4; window.DUR = DUR;
const BLUE = '#00A1FF', INK = '#0e0e10', GREY = '#8a8a86', LINE = '#ececE8', EMER = '#059669';
const C = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const M = (a, b, p) => a + (b - a) * p;
const P = (t, a, d) => C((t - a) / d);
const E = { io: (x) => (x < .5 ? 4 * x * x * x : 1 - (-2 * x + 2) ** 3 / 2), o3: (x) => 1 - (1 - x) ** 3, o4: (x) => 1 - (1 - x) ** 4, i3: (x) => x * x * x, qio: (x) => (x < .5 ? 8 * x ** 4 : 1 - (-2 * x + 2) ** 4 / 2) };
function spring(t, k = 170, d = 26) { if (t <= 0) return 0; const w = Math.sqrt(k), z = d / (2 * w); if (z >= 1) return 1 - Math.exp(-w * t) * (1 + w * t); const wd = w * Math.sqrt(1 - z * z); return 1 - Math.exp(-z * w * t) * (Math.cos(wd * t) + (z * w / wd) * Math.sin(wd * t)); }
function mulberry32(a) { return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function el(tag, cls, parent, html = '', style = '') { const e = document.createElement(tag); if (cls) e.className = cls; if (html) e.innerHTML = html; if (style) e.style.cssText = style; parent.appendChild(e); return e; }
const box = (e, x, y, w, h) => { e.style.left = x + 'px'; e.style.top = y + 'px'; e.style.width = w + 'px'; e.style.height = h + 'px'; };

// légende centrée, mots qui montent d'une ligne de masque

function cap(txt, y, size, times, tout, color = INK, parent = cam) {

  const o = { d, ws, times, tout }; CAPS.push(o); return o;
}
function animCap(o, t) { const on = t >= o.times[0] - .1 && t < o.tout + .45; vis(o.d, on); if (!on) return; const po = E.i3(P(t, o.tout, .35)); o.ws.forEach((s, i) => { const p = E.o4(P(t, (o.times[i] ?? o.times[o.times.length - 1]) - .05, .5)); s.style.transform = `translateY(${(1 - p) * 150 - po * 150}%)`; }); }

/* ================= A · des pubs en motion design (0 – 4,6) ================= */

  const bar = el('div', 'a', card, '', 'left:58px;right:84px;bottom:27px;height:4px;border-radius:2px;background:#e6e6e2');
  const fill = el('div', 'a', bar, '', `left:0;top:0;bottom:0;border-radius:2px;background:${INK}`);
  el('div', 'a', card, `<svg width="14" height="14" viewBox="0 0 24 24"><path d="M7 4v16l13-8z" fill="${INK}"/></svg>`, 'left:24px;bottom:22px');

}

const FMT = ['16:9', '9:16', '1:1'];
const fmtTag = FMT.map((f) => el('div', 'a', cam, f, `padding:6px 12px;border-radius:999px;background:${INK};color:#fff;font:500 15px U;z-index:12`));
function playMini(o, t, t0) {
  // point -> cercle -> carré qui tourne -> pilule « motion design » -> point (boucle de 3 s)
  const cw = o.canv.offsetWidth || (o.w - 24), ch = o.canv.offsetHeight || (o.h - 70);
  const u = ((t - t0) % 3.2 + 3.2) % 3.2;
  const a = spring(u - .1, 200, 22), b = spring(u - .8, 200, 22), c = spring(u - 1.5, 200, 24), d = spring(u - 2.6, 260, 30);
  const s0 = Math.min(cw, ch);
  let size = M(0, s0 * .12, a); size = M(size, s0 * .42, b);
  let wv = size, hv = size, r = size / 2, rot = 0;
  wv = M(wv, s0 * .36, b); hv = M(hv, s0 * .36, b); r = M(r, s0 * .08, b); rot = 90 * (b - c);
  wv = M(wv, Math.min(cw * .78, s0 * 1.25), c); hv = M(hv, s0 * .2, c); r = M(r, s0 * .1, c);
  wv = M(wv, s0 * .1, d); hv = M(hv, s0 * .1, d); r = M(r, s0 * .05, d);
  box(o.shape, cw / 2 - wv / 2, ch / 2 - hv / 2, wv, hv); o.shape.style.borderRadius = r + 'px';
  o.shape.style.transform = `rotate(${rot}deg)`;
  o.shape.style.fontSize = (s0 * .085) + 'px'; o.shape.textContent = c > .6 && d < .3 ? 'motion design' : '';
  o.shape.style.opacity = 1;
  o.fill.style.width = (100 * C(t / 4.4)) + '%'; o.tm.textContent = `0:0${Math.min(9, Math.floor(t))}`;
}

const TW = 400, TH = 225, TG = 22, WR = 2300, COLS = 15, ROWS = 4;
const DTH = (TW + TG) / WR;
const wTiles = [];
for (let r = 0; r < ROWS; r++) for (let k = 0; k < COLS; k++) {

  const im = el('img', '', e, '', 'width:100%;height:100%;object-fit:cover;display:block');
  wTiles.push({ e, im, r, k, id, src: '' });
}

const capA2 = cap('comme les *grandes marques.*', 494, 64, [3.12, 3.28, 3.84, 4.08], 4.35);
const capBack = el('div', 'a', cam, '', 'left:440px;top:455px;width:1040px;height:150px;border-radius:75px;background:rgba(245,245,242,.94);box-shadow:0 30px 60px -30px rgba(0,0,0,.35);z-index:15');
capA1.d.style.zIndex = 16; capA2.d.style.zIndex = 16;
const wallLoads = [];
function animWall(t) {
  const on = t < 5.3; vis(wall, on); vis(capBack, on && t < 4.75); if (!on) return;
  const fold = E.i3(P(t, 4.45, .7));
  wallIn.style.transform = `scale(${1 - .55 * fold}) translateZ(${-fold * 900}px)`;
  wall.style.opacity = 1 - C((t - 4.9) / .3);
  const cb = spring(t - .7, 200, 26) * (1 - E.i3(P(t, 4.45, .3)));
  capBack.style.transform = `scale(${cb})`;
  wTiles.forEach((o) => {
    const dir = o.r % 2 ? -1 : 1;
    const scroll = dir * (t * .09 + fold * 1.2);
    let th = (o.k - (COLS - 1) / 2) * DTH + scroll;
    const span = COLS * DTH; th = ((th + span / 2) % span + span) % span - span / 2;
    const y = (o.r - (ROWS - 1) / 2) * (TH + TG) * (1 - .7 * fold);
    const visT = Math.abs(th) < .95; o.e.style.visibility = visT ? 'inherit' : 'hidden';
    o.e.style.transform = `translate3d(0,${y}px,${WR}px) rotateY(${th}rad) translate3d(0,0,${-WR}px)`;
    const n = TCOUNT[o.id]; const fi = (Math.floor(t * 30) % n) + 1; const src = `tiles/t${String(o.id).padStart(2, '0')}/${String(fi).padStart(3, '0')}.jpg`;
    if (visT && o.src !== src) { o.src = src; o.im.src = src; wallLoads.push(o.im); }
  });
}

  if (i === 0) el('img', 'a', c, '', 'left:24px;top:16px;width:40px;height:40px').src = IMG + 'ae.png';
  const body = el('div', 'a', c, '', 'left:22px;top:72px;right:22px;bottom:22px;border-radius:16px;background:#f6f6f3;overflow:hidden');
  return { c, body, t: OB[i][1] };
});
// 1 · timeline à keyframes
const kfRows = []; for (let r = 0; r < 6; r++) { const rw = el('div', 'a', obs[0].body, '', `left:14px;right:14px;top:${18 + r * 40}px;height:24px`); el('div', 'a', rw, '', 'left:0;top:9px;width:50px;height:6px;border-radius:3px;background:#dcdcd7'); el('div', 'a', rw, '', 'left:66px;right:0;top:11px;height:2px;background:#e6e6e2'); const ds = []; const rnd = mulberry32(r + 3); for (let k = 0; k < 9; k++) ds.push(el('div', 'a', rw, '', `left:${70 + rnd() * 300}px;top:5px;width:12px;height:12px;background:${INK};transform:rotate(45deg) scale(0);border-radius:2px`)); kfRows.push(ds); }

/* ================= C · Claude Opus 5.5 (12,4 – 19,4) ================= */
const CMP = { x: 510, y: 690, w: 900, h: 104 };
const glow = el('div', 'a', cam, '', `border-radius:64px;filter:blur(18px);z-index:19`);

 <div class="a" style="left:15px;top:15px;width:490px;height:276px;border-radius:20px;overflow:hidden"><img src="${IMG}c_motion.jpg" style="width:100%;height:100%;object-fit:cover"></div>

 <div class="a" style="left:22px;right:22px;top:424px;display:flex;justify-content:space-between;font:500 16px U;color:#6f6f6b"><span style="display:flex;gap:7px;align-items:center">${svgI('layers', 17)}1 module</span><span style="display:flex;gap:7px;align-items:center">${svgI('file', 17)}4 chapitres</span></div>
 <div class="a" style="left:22px;right:22px;top:460px;height:1px;background:#ececE8"></div>
 <div class="a" style="left:22px;top:480px;display:flex;align-items:baseline;gap:12px"><span style="font:600 36px U;letter-spacing:-.02em">29 €</span><span style="font:500 19px U;color:#a8a8a4;text-decoration:line-through">97 €</span></div>
 <div class="a" style="right:22px;top:484px;padding:5px 10px;border-radius:7px;background:rgba(16,185,129,.1);box-shadow:inset 0 0 0 1px rgba(16,185,129,.22);color:${EMER};font:600 15px U">−70 %</div>
