  io: (x) => (x < .5 ? 4 * x * x * x : 1 - (-2 * x + 2) ** 3 / 2),

  if (t <= 0) return 0; const w = Math.sqrt(k), z = d / (2 * w);

}

const lab = el('div', 'a', over, '✓ C\'est parti', 'left:0;top:0;font:600 16px G;white-space:nowrap;transform-origin:50% 50%');
function words(txt, y, t0, step) {

const L1 = words('Tu voulais une compétence.', 330, bt(23.4), B * .5);

/* ---------- caméra : [t, zoom, x, y] ---------- */
const BTN = { x: S.x + PILL.x + PILL.w / 2, y: S.y + PILL.y + PILL.h / 2 };
const CAM = [[0, 2.35, 960, S.y + CMP.y + CMP.h / 2], [bt(6), 3.0, 960, S.y + CMP.y + CMP.h / 2], [bt(8.6), 1.1, 960, 540], [bt(12), 1.15, 960, 540], [bt(16), 1.2, 960, 540], [bt(21), 1.42, 960, 560], [bt(24), 3.4, BTN.x, BTN.y], [DUR, 3.4, BTN.x, BTN.y]];

  const [a, z0, x0, y0] = CAM[i], [b, z1, x1, y1] = CAM[i + 1], e = E.io(C((t - a) / (b - a)));
  return { z: Math.exp(M(Math.log(z0), Math.log(z1), e)), x: M(x0, x1, e), y: M(y0, y1, e) };

/* ================= SEEK ================= */
function seek(t) {
  const K = camAt(t);
  cam.style.transform = `translate(960px,540px) scale(${K.z}) translate(${-K.x}px,${-K.y}px)`;

  typed.forEach((e) => vis(e, !sent));
  const cw = typed[lastLi].getBoundingClientRect().width / (K.z || 1);
  caret.style.left = (20 + typed[lastLi].offsetWidth + 1) + 'px'; caret.style.top = (16 + lastLi * 26) + 'px';
  vis(caret, !sent && t > .1 && (Math.floor(t * 3.2) % 2 === 0 || t < KEYS[KEYS.length - 1].t + .1));
  vis(placeholder, sent && t > bt(6) + .7 || t < KEYS[0].t);

  /* ondulation citron puis bulle partagée */
  const rp = E.o3(P(t, bt(6), .28));
  vis(ripple, t >= bt(6) && !sent);
  const r = rp * 420; box(ripple, 362 - r, 82 - r, 2 * r, 2 * r);

    const m = E.io(P(t, bt(6) + .28, .5));

    box(msg, x, y, w, h); msg.style.borderRadius = `${M(26, 22, m)}px ${M(26, 22, m)}px ${M(26, 6, m)}px ${M(26, 22, m)}px`;
    msgT.forEach((e, i) => { e.style.left = M(20, 18, m) + 'px'; e.style.top = (M(14, 16, m) + i * M(26, 24, m)) + 'px'; });
  }

  /* bouton envoyer -> wok */

  const mp = E.io(P(t, bt(6.8), .55));

  box(sendBtn, bx, by, bw, bh);
  const rt_ = M(22, 0, mp), rbx = M(22, WOK.w / 2, mp), rby = M(22, WOK.h, mp);
  sendBtn.style.borderRadius = `${rt_}px ${rt_}px ${rbx}px ${rbx}px / ${rt_}px ${rt_}px ${rby}px ${rby}px`;
  const cmix = (a, b, p) => { const h = (s) => [1, 3, 5].map((k) => parseInt(s.substr(k, 2), 16)); const A = h(a), Bc = h(b); return `rgb(${A.map((v, i) => Math.round(M(v, Bc[i], p))).join(',')})`; };
  sendBtn.style.background = `hsl(${M(201, 380, mp) % 360},100%,${M(50, 58, mp)}%)`;
  // basculement du wok à chaque lancer
  let tilt = 0; TOSS.forEach(([b]) => { const d = t - bt(b); if (d >= 0) tilt += -12 * Math.exp(-d / .12) * Math.sin(Math.min(d / .22, 1) * Math.PI); });
  sendBtn.style.transformOrigin = '50% 0'; sendBtn.style.transform = `scale(${press}) rotate(${tilt}deg)`;
  sendIco.style.transform = `scale(${1 - E.o3(P(t, bt(6.8), .2))})`;
  const hp = spring(t - bt(7.9), 260, 26); handle.style.transform = `scaleX(${hp}) rotate(${tilt}deg)`; vis(handle, t >= bt(7.9));
  vis(sendBtn, t < bt(12) + .4); vis(handle, t >= bt(7.9) && t < bt(12) + .4);
  const s2 = spring(t - bt(9), 260, 24); send2.style.transform = `scale(${s2})`;
  // ingrédients
  toks.forEach((k, i) => {
    const on = t >= bt(7.9) && t < bt(12) + .4; vis(k, on); if (!on) return;
